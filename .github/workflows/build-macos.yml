name: Build and Notarize macOS DMG

on:
  push:
    tags:
      - 'deluge-*'
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-14
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
      CFLAGS: "-arch arm64 -arch x86_64 -mmacosx-version-min=11.0 -O3"
      CXXFLAGS: "-arch arm64 -arch x86_64 -mmacosx-version-min=11.0 -O3"
      LDFLAGS: "-arch arm64 -arch x86_64 -mmacosx-version-min=11.0"
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch Git Tags Explicitly
        run: |
          git fetch --tags --force

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System Dependencies
        env:
          # Bypass Homebrew tap trust blocking warnings on the runner environment
          HOMEBREW_NO_REQUIRE_TAP_TRUST: 1
        run: |
          # Clean fallback list without forcing untracked third-party taps
          brew install --formula --build-from-source dylibbundler create-dmg gtk+3 adwaita-icon-theme libtorrent-rasterbar

      - name: Import Apple Developer Certificate
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE }}
          P12_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
          KEYCHAIN_PASSWORD: "temporary_actions_password"
        run: |
          # Create a temporary keychain to hold the certificate securely
          echo $BUILD_CERTIFICATE_BASE64 | base64 --decode --output certificate.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security import certificate.p12 -k build.keychain -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain

      - name: Create Entitlements File
        run: |
          cat <<EOF > entitlements.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://apple.com">
          <plist version="1.0">
          <dict>
              <key>com.apple.security.cs.allow-jit</key>
              <true/>
              <key>com.apple.security.cs.allow-unsigned-executable-memory</key>
              <true/>
              <key>com.apple.security.cs.disable-library-validation</key>
              <true/>
          </dict>
          </plist>
          EOF

      - name: Compile and Package App
        run: |
          # Setup baseline packaging systems in a single call
          pip install --upgrade pip wheel "setuptools==81.0.0" pyinstaller

          # 1. Resolve application production runtime version tags
          if [[ "${{ github.ref }}" == refs/tags/deluge-* ]]; then
            RAW_VERSION="${{ github.ref_name }}"
            APP_VERSION="${RAW_VERSION#deluge-}"
          else
            APP_VERSION="2.2.0"
          fi
          echo "RESOLVED_APP_VERSION=$APP_VERSION" >> $GITHUB_ENV

          # Apply the dynamic patch immediately so setup.py can always evaluate the version number
          find . -name "version.py" -exec sed -i '' "s/def get_version.*/def get_version(*args, **kwargs):\n    return '${APP_VERSION}'/g" {} +

          # Create a localized staging folder to hold our custom universal wheels
          mkdir -p universal_wheels

          # 2. FIX: Build rencode from the upstream commit that drops -march=native / SSE flags,
          # which otherwise block a universal2 compile. See github.com/aresch/rencode commit e7ec8ea7.
          git clone --quiet https://github.com/aresch/rencode.git
          cd rencode
          git checkout --quiet e7ec8ea718e73a8fee7dbc007c262e1584f7f94b

          # Tag the version so it's traceable as a patched build, then read it straight
          # from pyproject.toml rather than inferring it from a filename later on.
          sed -i '' 's/^version = "1.0.8"/version = "1.0.8+universal2fix"/' pyproject.toml
          RENCODE_VERSION=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['tool']['poetry']['version'])")
          echo "Building rencode version: $RENCODE_VERSION"

          # Bypass Poetry's build path entirely: poetry-core cannot tag/produce universal2
          # wheels (see python-poetry/poetry#7107), so build directly against the
          # pre-generated C source with a plain setuptools Extension instead.
          rm -f build.py pyproject.toml poetry.lock
          cat <<EOF > setup.py
          from setuptools import setup, Extension
          setup(
              name="rencode",
              version="${RENCODE_VERSION}",
              ext_modules=[Extension("rencode._rencode", ["rencode/_rencode.c"])],
              packages=["rencode"],
          )
          EOF
          python setup.py bdist_wheel --plat-name macosx-11.0-universal2
          mv dist/*.whl ../universal_wheels/
          cd ..

          # FIX: Compile cffi, zope.interface, AND pygobject directly from source 
          # using our universal CFLAGS to ensure the 'gi' module is natively available
          pip wheel --no-binary cffi,zope.interface,pygobject -w universal_wheels cffi zope.interface pygobject

          # 3. Download explicit universal2 wheels for the core compiled libraries
          pip download --platform macosx_11_0_universal2 --only-binary=:all: --no-deps -d universal_wheels \
            cryptography twisted setproctitle pyopenssl service-identity

          # 4. FIX: Run the full tree scan pointing to our local wheel directory pool via --find-links
          # This allows pip to satisfy the 'rencode', 'cffi', and 'zope.interface' requirements instantly
          mkdir -p dependency_tree
          pip download --only-binary=:all: --find-links=universal_wheels -d dependency_tree .

          # Safely strip core binary duplicates out of the tree folder to prevent installation conflicts
          for pkg in cryptography twisted setproctitle pyOpenSSL service_identity deluge rencode cffi zope_interface; do
            rm -f dependency_tree/${pkg}-*.whl
          done

          # Merge the verified pure-python dependencies (pyxdg, mako, etc.) cleanly into the main staging area
          mv dependency_tree/*.whl universal_wheels/ 2>/dev/null || true

          # Force install the comprehensive, conflict-free universal environment tree
          pip install --force-reinstall --no-deps universal_wheels/*.whl

          # Re-apply non-dependent local application installation
          pip install . --no-deps

          # FIX: Generate a standard-compliant PyInstaller build hook to safely strip out the broken runtime script
          mkdir -p custom_hooks
          cat <<EOF > custom_hooks/hook-pkg_resources.py
          def change_runtime_hooks(run_hooks, api):
              # Safely locate and remove the broken pyi_rth_pkgres.py from PyInstaller's compilation queue
              return [hook for hook in run_hooks if 'pyi_rth_pkgres' not in hook]
          EOF

          # 5. Package application forcing path mapping to ensure universal assets are utilized
          pyinstaller --noconfirm --onedir --windowed --name="Deluge" \
            --target-architecture universal2 \
            --additional-hooks-dir=custom_hooks \
            --paths=/Library/Frameworks/Python.framework/Versions/3.11/lib/python3.11/site-packages \
            --add-data "deluge/ui/data:deluge/ui/data" \
            /Library/Frameworks/Python.framework/Versions/3.11/bin/deluge-gtk

          # Link non-python C libraries into the bundle wrapper structures
          dylibbundler -od -b -x dist/Deluge.app/Contents/MacOS/Deluge -d dist/Deluge.app/Contents/libs/

          # Ensure the runner keychain does not auto-lock during rapid loops
          security set-keychain-settings -lut 7200 build.keychain

          echo "Executing brute-force root dist-tree recursive signing pass..."
          find dist -type f -exec codesign --force --options runtime --timestamp --sign "${{ secrets.APPLE_DEVELOPER_IDENTITY }}" --keychain build.keychain {} \;

          # Final Step: Deep validation seal anchoring top-level app bundle container
          codesign --force --options runtime --deep --timestamp --sign "${{ secrets.APPLE_DEVELOPER_IDENTITY }}" --keychain build.keychain --entitlements entitlements.plist dist/Deluge.app

      - name: Build Outer DMG Installer
        run: |
          # 1. Create a clean, isolated staging directory for the installer payload
          mkdir -p installer_staging

          # 2. Copy ONLY the compiled .app bundle into the clean staging path
          cp -R dist/Deluge.app installer_staging/

          # 3. Generate the disk image targeting only the clean staging folder
          create-dmg \
            --volname "Deluge Universal Installer" \
            --window-pos 200 120 \
            --window-size 800 400 \
            --icon-size 100 \
            --icon "Deluge.app" 200 190 \
            --app-drop-link 600 190 \
            "Deluge-${{ env.RESOLVED_APP_VERSION }}-Universal.dmg" \
            "installer_staging/"

          # Force-sign the completed outer DMG file container smoothly via native codesign
          codesign --force --sign "${{ secrets.APPLE_DEVELOPER_IDENTITY }}" --keychain build.keychain "Deluge-${{ env.RESOLVED_APP_VERSION }}-Universal.dmg"

      - name: Notarize and Staple DMG
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # 1. Submit to Apple and capture the output log text to find the Submission ID
          SUBMISSION_OUT=$(xcrun notarytool submit "Deluge-${{ env.RESOLVED_APP_VERSION }}-Universal.dmg" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_PASSWORD" \
            --team-id "$TEAM_ID" \
            --wait 2>&1)
          echo "$SUBMISSION_OUT"

          # Extract the unique submission ID character string cleanly
          SUBMISSION_ID=$(echo "$SUBMISSION_OUT" | awk '/id: / { print $2;exit; }')

          # 2. Check if the notarization transaction was rejected by Apple's servers
          if echo "$SUBMISSION_OUT" | grep -q "status: Invalid"; then
            echo "❌ Apple Notary Service rejected the binary asset package!"
            echo "Fetching Apple's comprehensive diagnostic failure logs..."
            # Print the exact failure reasons directly into the GitHub Actions log console
            xcrun notarytool log "$SUBMISSION_ID" \
              --apple-id "$APPLE_ID" \
              --password "$APPLE_PASSWORD" \
              --team-id "$TEAM_ID"
            exit 1
          fi

          # 3. Staple the approved ticket only if the status clears successfully
          xcrun stapler staple "Deluge-${{ env.RESOLVED_APP_VERSION }}-Universal.dmg"

      - name: Upload Finished DMG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Deluge-macOS-Universal
          path: Deluge-${{ env.RESOLVED_APP_VERSION }}-Universal.dmg