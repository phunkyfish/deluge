name: Build and Notarize macOS DMG

on:
  push:
    tags:
      - 'deluge-*'
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-14
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
      CFLAGS: "-arch arm64 -arch x86_64 -mmacosx-version-min=11.0 -O3"
      CXXFLAGS: "-arch arm64 -arch x86_64 -mmacosx-version-min=11.0 -O3"
      LDFLAGS: "-arch arm64 -arch x86_64 -mmacosx-version-min=11.0"
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch Git Tags Explicitly
        run: |
          git fetch --tags --force

      - name: Deploy True Universal2 Python Framework
        run: |
          # Isolate version tokens away from the URL string to prevent markdown rendering bugs
          export PY_MAJOR_VERSION="3.11"
          export PY_PATCH_VERSION="3.11.9"

          echo "Targeting Python version: ${PY_PATCH_VERSION}"

          # Construct the clean download query path dynamically
          export DOWNLOAD_URL="https://python.org/ftp/python/${PY_PATCH_VERSION}/python-${PY_PATCH_VERSION}-macos11.pkg"

          echo "Downloading from path: ${DOWNLOAD_URL}"
          curl -L -o python_installer.pkg "${DOWNLOAD_URL}"

          echo "Installing universal2 framework package..."
          sudo installer -pkg python_installer.pkg -target /

          # Force export the new bin target location straight to the active runner environment
          echo "/Library/Frameworks/Python.framework/Versions/${PY_MAJOR_VERSION}/bin" >> $GITHUB_PATH

      - name: Install System Packaging Tools & Libtorrent
        env:
          HOMEBREW_NO_REQUIRE_TAP_TRUST: 1
          HOMEBREW_NO_ANALYTICS: 1
        run: |
          brew install --formula dylibbundler create-dmg libtorrent-rasterbar

      - name: Import Apple Developer Certificate
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE }}
          P12_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
          KEYCHAIN_PASSWORD: "temporary_actions_password"
        run: |
          echo $BUILD_CERTIFICATE_BASE64 | base64 --decode --output certificate.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security import certificate.p12 -k build.keychain -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain

      - name: Create Entitlements File
        run: |
          cat <<EOF > entitlements.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://apple.com">
          <plist version="1.0">
          <dict>
              <key>com.apple.security.cs.allow-jit</key>
              <true/>
              <key>com.apple.security.cs.allow-unsigned-executable-memory</key>
              <true/>
              <key>com.apple.security.cs.disable-library-validation</key>
              <true/>
          </dict>
          </plist>
          EOF

      - name: Compile and Package App
        run: |
          export PATH="/Library/Frameworks/Python.framework/Versions/3.11/bin:$PATH"
          python3 -m pip install --upgrade pip wheel "setuptools==81.0.0" pyinstaller

          # 1. Resolve application production runtime version tags
          if [[ "${{ github.ref }}" == refs/tags/deluge-* ]]; then
            RAW_VERSION="${{ github.ref_name }}"
            APP_VERSION="${RAW_VERSION#deluge-}"
          else
            APP_VERSION="2.2.0"
          fi
          echo "RESOLVED_APP_VERSION=$APP_VERSION" >> $GITHUB_ENV
          find . -name "version.py" -exec sed -i '' "s/def get_version.*/def get_version(*args, **kwargs):\n    return '${APP_VERSION}'/g" {} +
          mkdir -p universal_wheels

          # 2. Build explicit universal2 rencode package safely
          git clone --quiet https://github.com/aresch/rencode.git
          cd rencode
          git checkout --quiet e7ec8ea718e73a8fee7dbc007c262e1584f7f94b
          sed -i '' -E 's/^(version = ")([^"]+)(")/\1\2+universal2fix\3/' pyproject.toml
          RENCODE_VERSION=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['tool']['poetry']['version'])")
          python3 -m pip install --quiet cython
          cython -3 rencode/_rencode.pyx

          rm -f build.py pyproject.toml poetry.lock
          cat <<EOF > setup.py
          from setuptools import setup, Extension
          setup(
              name="rencode",
              version="${RENCODE_VERSION}",
              ext_modules=[Extension("rencode._rencode", ["rencode/_rencode.c"])],
              packages=["rencode"],
          )
          EOF
          python3 setup.py bdist_wheel --plat-name macosx-11.0-universal2
          mv dist/*.whl ../universal_wheels/
          cd ..

          # 2. DOWNLOAD GENUINE UNIVERSAL2 / PURE-PYTHON BINARIES EXCLUSIVELY WITHOUT DEPS
          python3 -m pip download --platform macosx_11_0_universal2 --only-binary=:all: --no-deps -d universal_wheels \
            cryptography twisted setproctitle pyopenssl service-identity mako

          # 3. COMPLIANT LOCAL SOURCE COMPILATIONS (Emits native universal2 dual-slices)
          python3 -m pip wheel --no-binary cffi,pygobject,markupsafe -w universal_wheels cffi pygobject markupsafe

          # 4. Gather the rest of your app dependencies
          python3 -m pip wheel --find-links=universal_wheels -w universal_wheels .

          # 5. RESOLVE DUPLICATE OVERLAPS
          mkdir -p dependency_tree
          python3 -m pip download --only-binary=:all: --find-links=universal_wheels -d dependency_tree .

          for pkg in cryptography twisted setproctitle pyOpenSSL service_identity deluge rencode cffi zope_interface libtorrent pygobject markupsafe mako; do
            rm -f dependency_tree/${pkg}-*.whl 2>/dev/null || true
          done
          mv dependency_tree/*.whl universal_wheels/ 2>/dev/null || true

          # CRITICAL FIXED POSITION: Purge any single-architecture thin wheels out of the staging pool.
          # This leaves your custom universal2 wheels untouched, forcing pip to select them.
          rm -f universal_wheels/*_arm64.whl
          rm -f universal_wheels/*_x86_64.whl

          # Force clean universal stack synchronization installation
          python3 -m pip install --force-reinstall --no-deps universal_wheels/*.whl
          python3 -m pip install . --no-deps

          # FIX STEP 3: Harvest Homebrew-compiled libtorrent bindings and inject directly into site-packages
          BREW_PREFIX=$(brew --prefix)
          echo "Extracting local bindings out of Homebrew framework trees..."
          cp -r $BREW_PREFIX/lib/python3.11/site-packages/libtorrent* /Library/Frameworks/Python.framework/Versions/3.11/lib/python3.11/site-packages/ 2>/dev/null || true

          # Generate localized runtime environment initialization hooks
          cat <<'EOF' > gi_runtime_hook.py
          import os
          import sys
          import ctypes

          bundle_dir = getattr(sys, '_MEIPASS', os.path.dirname(os.path.abspath(__file__)))
          frameworks_dir = os.path.abspath(os.path.join(bundle_dir, '..', 'Frameworks'))
          resources_dir = os.path.abspath(os.path.join(bundle_dir, '..', 'Resources'))

          if not os.path.exists(frameworks_dir):
              frameworks_dir = bundle_dir
          if not os.path.exists(resources_dir):
              resources_dir = bundle_dir

          # 1. Direct Pre-loading for GObject Introspection dylibs (Bypasses dyld restriction)
          for dylib in os.listdir(frameworks_dir):
              if dylib.endswith('.dylib'):
                  try:
                      ctypes.CDLL(os.path.join(frameworks_dir, dylib))
                  except Exception:
                      pass

          # 2. Environment Variables
          os.environ['DYLD_FALLBACK_LIBRARY_PATH'] = f"{frameworks_dir}:{os.environ.get('DYLD_FALLBACK_LIBRARY_PATH', '')}"
          os.environ['DYLD_LIBRARY_PATH'] = f"{frameworks_dir}:{os.environ.get('DYLD_LIBRARY_PATH', '')}"
          os.environ['GI_TYPELIB_PATH'] = f"{resources_dir}/gi_typelibs:{bundle_dir}/gi_typelibs:{os.environ.get('GI_TYPELIB_PATH', '')}"

          # 3. GTK Asset Paths
          os.environ['GSETTINGS_SCHEMA_DIR'] = os.path.join(resources_dir, 'glib-2.0', 'schemas')
          os.environ['XDG_DATA_DIRS'] = f"{resources_dir}:{os.environ.get('XDG_DATA_DIRS', '/usr/local/share:/usr/share')}"
          EOF

          # ====================================================================
          # CLEAR ALL OLD STALE COMPILATION CACHES
          # ====================================================================
          echo "Purging old build cache directories to prevent metadata reuse..."
          rm -rf build/ dist/ *.spec run_deluge.py 2>/dev/null || true

          # Synthesize a clean local bootstrap entrypoint script
          echo "from deluge.ui.gtk3.gtkui import GtkUI" > run_deluge.py
          echo "import sys" >> run_deluge.py
          echo "def start():" >> run_deluge.py
          echo "    ui = GtkUI()" >> run_deluge.py
          echo "    ui.start()" >> run_deluge.py
          echo "if __name__ == '__main__':" >> run_deluge.py
          echo "    start()" >> run_deluge.py

          # Extract explicit system paths out of the active Python.org framework
          SYS_SITEPACKAGES="/Library/Frameworks/Python.framework/Versions/3.11/lib/python3.11/site-packages"

          # FIXED LOGIC: Programmatically resolve the exact absolute file path to the true universal2 library
          PYTHON_FRAMEWORK_LIB="/Library/Frameworks/Python.framework/Versions/3.11/Python"
          echo "Explicitly binding PyInstaller to the core framework file at: $PYTHON_FRAMEWORK_LIB"

          # ====================================================================
          # NATIVE COMPILATION PIPELINE
          # ====================================================================

          PYTHON_FRAMEWORK="/Library/Frameworks/Python.framework/Versions/3.11/bin/python3"
          HB_PREFIX=$(brew --prefix)

          # 1. Install dependencies into isolated site-packages workspace
          # Force pip to build zope.interface from source using your CFLAGS/LDFLAGS
          ARCHFLAGS="-arch arm64 -arch x86_64" $PYTHON_FRAMEWORK -m pip install \
            --target="$SYS_SITEPACKAGES" \
            --no-binary zope.interface \
            pygobject zope.interface

          $PYTHON_FRAMEWORK -m pip install --target="$SYS_SITEPACKAGES" --upgrade --no-deps .

          # 2. Convert zope into a standard importable package for PyInstaller
          ZOPE_DIR="$SYS_SITEPACKAGES/zope"
          mkdir -p "$ZOPE_DIR"
          touch "$ZOPE_DIR/__init__.py"

          # 3. Register site-packages location for spec generation
          GI_DIR="$SYS_SITEPACKAGES/gi"
          export PYTHONPATH="$SYS_SITEPACKAGES:$PYTHONPATH"

          # Collect GTK3, Pango, GDK, Cairo, and GLib dylibs directly from Brew paths
          BINARIES_ARG=()

          # Target specific Homebrew cellar paths to prevent missing symlinked dylibs
          SEARCH_PATHS=(
            "$HB_PREFIX/lib"
            "$HB_PREFIX/opt/pango/lib"
            "$HB_PREFIX/opt/gtk+3/lib"
            "$HB_PREFIX/opt/cairo/lib"
            "$HB_PREFIX/opt/glib/lib"
            "$HB_PREFIX/opt/harfbuzz/lib"
            "$HB_PREFIX/opt/gdk-pixbuf/lib"
          )

          for search_dir in "${SEARCH_PATHS[@]}"; do
            if [ -d "$search_dir" ]; then
              for lib in "$search_dir"/lib*.dylib; do
                if [ -f "$lib" ] || [ -L "$lib" ]; then
                  BINARIES_ARG+=(--add-binary "$lib:.")
                fi
              done
            fi
          done

          # 3. Generate spec file collecting GI binaries & typelibs
          pyi-makespec --onedir --windowed --name="Deluge" \
            --runtime-hook=gi_runtime_hook.py \
            --target-architecture=universal2 \
            -i "deluge/ui/data/pixmaps/deluge.icns" \
            --paths="$SYS_SITEPACKAGES" \
            "${BINARIES_ARG[@]}" \
            --exclude-module=PIL \
            --exclude-module=Pillow \
            --exclude-module=setuptools \
            --exclude-module=pkg_resources \
            --collect-all gi \
            --collect-all deluge \
            --collect-all twisted \
            --collect-all zope.interface \
            --hidden-import=gi \
            --hidden-import=gi.repository.Gtk \
            --hidden-import=gi.repository.Gdk \
            --hidden-import=gi.repository.GLib \
            --hidden-import=gi.repository.GObject \
            --hidden-import=gi.repository.Gio \
            --hidden-import=gi.repository.Pango \
            --hidden-import=gi.repository.cairo \
            --hidden-import=deluge.ui.gtk3.gtkui \
            --hidden-import=deluge.ui.gtk3.main \
            --hidden-import=zope \
            --hidden-import=zope.interface \
            --hidden-import=libtorrent \
            --add-data "$SYS_SITEPACKAGES/deluge/ui/data:deluge/ui/data" \
            --add-data "$ZOPE_DIR:zope" \
            --add-data "$GI_DIR:gi" \
            --add-data "$HB_PREFIX/lib/girepository-1.0:gi_typelibs" \
            --osx-bundle-identifier="org.deluge-torrent.deluge" \
            run_deluge.py

          # 4. Build app bundle
          # 1. Build app bundle with pyinstaller
          pyinstaller --clean Deluge.spec

          # Post-build repair
          APP_FRAMEWORKS="dist/Deluge.app/Contents/Frameworks"
          APP_MACOS="dist/Deluge.app/Contents/MacOS"
          HB_PREFIX=$(brew --prefix)

          echo "Explicitly harvesting GTK3 & Pango ecosystem dylibs from Homebrew..."

          # Resolve cellular or opt locations explicitly
          PANGO_LIB=$(brew --prefix pango 2>/dev/null)/lib
          GTK_LIB=$(brew --prefix gtk+3 2>/dev/null)/lib
          CAIRO_LIB=$(brew --prefix cairo 2>/dev/null)/lib
          GLIB_LIB=$(brew --prefix glib 2>/dev/null)/lib

          cp -f "$PANGO_LIB"/libpango*.dylib "$APP_FRAMEWORKS/" 2>/dev/null || true
          cp -f "$GTK_LIB"/libgtk*.dylib "$APP_FRAMEWORKS/" 2>/dev/null || true
          cp -f "$GTK_LIB"/libgdk*.dylib "$APP_FRAMEWORKS/" 2>/dev/null || true
          cp -f "$CAIRO_LIB"/libcairo*.dylib "$APP_FRAMEWORKS/" 2>/dev/null || true
          cp -f "$GLIB_LIB"/libglib*.dylib "$APP_FRAMEWORKS/" 2>/dev/null || true
          cp -f "$GLIB_LIB"/libgio*.dylib "$APP_FRAMEWORKS/" 2>/dev/null || true
          cp -f "$GLIB_LIB"/libgobject*.dylib "$APP_FRAMEWORKS/" 2>/dev/null || true

          # Create unversioned/versioned alias symlinks for ALL GTK/GLib libraries
          cd "$APP_FRAMEWORKS"
          for f in *.dylib; do
            if [ -e "$f" ]; then
              base_name=$(echo "$f" | sed -E 's/\.dylib$//')

              if [[ "$base_name" =~ -[0-9]+\.[0-9]+$ ]]; then
                target_alias="${base_name}.0.dylib"
                if [ ! -e "$target_alias" ]; then
                  ln -s "$f" "$target_alias" 2>/dev/null || true
                fi
              fi

              if [[ "$base_name" =~ -[0-9]+$ ]]; then
                target_alias="${base_name}.0.0.dylib"
                if [ ! -e "$target_alias" ]; then
                  ln -s "$f" "$target_alias" 2>/dev/null || true
                fi
              fi
            fi
          done
          cd - > /dev/null


          # Set LC_RPATH on the main executable and all dylibs
          install_name_tool -add_rpath "@executable_path/../Frameworks" "$APP_MACOS/Deluge" 2>/dev/null || true

          find "$APP_FRAMEWORKS" -type f \( -name "*.dylib" -o -name "*.so" \) | while read -r binary; do
            install_name_tool -add_rpath "@loader_path" "$binary" 2>/dev/null || true
            install_name_tool -add_rpath "@executable_path/../Frameworks" "$binary" 2>/dev/null || true

            otool -L "$binary" | grep "/opt/homebrew" | awk '{print $1}' | while read -r dep; do
              dep_name=$(basename "$dep")
              install_name_tool -change "$dep" "@rpath/$dep_name" "$binary" 2>/dev/null || true
            done
          done

          # ====================================================================
          # HYPER-COMPLIANT SLIM PYTHON FRAMEWORK STRUCTURAL EMBED
          # ====================================================================

          APP_PATH="$GITHUB_WORKSPACE/dist/Deluge.app"
          APP_FRAMEWORKS="$APP_PATH/Contents/Frameworks"
          APP_RESOURCES="$APP_PATH/Contents/Resources"

          # ====================================================================
          # INJECT GTK3 THEMES, ASSETS, AND CORE GLIB SYSTEM SCHEMAS
          # ====================================================================
          echo "Injecting mandatory GTK runtime assets to protect standalone execution..."

          HB_PREFIX=$(brew --prefix)

          # 1. Bundle and compile GLib GSettings Schemas (Prevents FileChooser Crashes)
          mkdir -p "$APP_RESOURCES/glib-2.0/schemas"
          cp -f "$HB_PREFIX/share/glib-2.0/schemas"/*.xml "$APP_RESOURCES/glib-2.0/schemas/" 2>/dev/null || true
          glib-compile-schemas "$APP_RESOURCES/glib-2.0/schemas"

          # 2. Bundle UI Icon Themes (Prevents Blank GTK Widgets)
          mkdir -p "$APP_RESOURCES/share/icons/Adwaita"
          mkdir -p "$APP_RESOURCES/share/icons/hicolor"
          cp -r "$HB_PREFIX/share/icons/Adwaita/"* "$APP_RESOURCES/share/icons/Adwaita/" 2>/dev/null || true
          cp -r "$HB_PREFIX/share/icons/hicolor/"* "$APP_RESOURCES/share/icons/hicolor/" 2>/dev/null || true

          # ====================================================================
          # CLEAN IDENTIFICATION REWRITING PASS (FIXED)
          # ====================================================================
          # 1. Set explicit Mach-O ID on the embedded Python binary
          if [ -f "$APP_FRAMEWORKS/Python" ]; then
            chmod 755 "$APP_FRAMEWORKS/Python"
            install_name_tool -id "@executable_path/../Frameworks/Python" "$APP_FRAMEWORKS/Python" 2>/dev/null || true
          fi

          # 2. Fix IDs on all dylibs and C-extensions (.so files)
          find "$APP_FRAMEWORKS" -type f \( -name "*.dylib" -o -name "*.so" \) | while read -r lib; do
            bname=$(basename "$lib")
            install_name_tool -id "@executable_path/../Frameworks/$bname" "$lib" 2>/dev/null || true
          done

          ls -la dist/Deluge.app/Contents/Frameworks/

          # ====================================================================
          # ORDERED INSIDE-OUT CODE SIGNING PIPELINE
          # ====================================================================
          echo "Setting permissions on the bundle before signing..."
          APP_PATH="$GITHUB_WORKSPACE/dist/Deluge.app"

          # Remove broken symlinks that crash 'codesign --verify'
          find "$APP_PATH" -type l ! -exec test -e {} \; -delete

          chmod -R 755 $APP_PATH

          echo "Executing deep structured inside-out architecture signing loops..."
          security set-keychain-settings -lut 7200 build.keychain
          security unlock-keychain -p "temporary_actions_password" build.keychain

          # 1. Sign Python as a unified Bundle
          codesign --force --options runtime --timestamp --sign "${{ secrets.APPLE_DEVELOPER_IDENTITY }}" \
            --keychain build.keychain "$APP_FRAMEWORKS/Python"

          # 2. Sign all dynamic libraries and C-extensions recursively (excluding framework dirs)
          find "$APP_PATH" -type f \( -name "*.dylib" -o -name "*.so" \) \
            -exec codesign --force --options runtime --timestamp --sign "${{ secrets.APPLE_DEVELOPER_IDENTITY }}" --keychain build.keychain {} \;

          # 3. Sign main executable WITH entitlements
          codesign --force --options runtime --timestamp --entitlements entitlements.plist --sign "${{ secrets.APPLE_DEVELOPER_IDENTITY }}" \
            --keychain build.keychain "$APP_PATH/Contents/MacOS/Deluge"

          # 4. Sign outer App bundle WITH entitlements
          codesign --force --options runtime --timestamp --entitlements entitlements.plist --sign "${{ secrets.APPLE_DEVELOPER_IDENTITY }}" \
            --keychain build.keychain "$APP_PATH"

          echo "Verifying local code signature..."
          codesign --verify --verbose=4 --deep --strict $APP_PATH

          echo "Application signing pass successfully completed."

      - name: Build Outer DMG Installer
        run: |
          # 1. Create a pristine, isolated directory for the installer payload
          mkdir -p secure_dmg_staging

          # 2. Use native 'ditto' to safely copy the app bundle while preserving all signatures
          ditto $GITHUB_WORKSPACE/dist/Deluge.app secure_dmg_staging/Deluge.app

          # 3. Generate the disk image pointing exclusively to the clean staging folder
          create-dmg \
            --volname "Deluge Universal Installer" \
            --window-pos 200 120 \
            --window-size 800 400 \
            --icon-size 100 \
            --icon "Deluge.app" 200 190 \
            --app-drop-link 600 190 \
            "Deluge-${{ env.RESOLVED_APP_VERSION }}-Universal.dmg" \
            "secure_dmg_staging/"

          # 4. Force-sign the completed outer DMG file container
          codesign --force --sign "${{ secrets.APPLE_DEVELOPER_IDENTITY }}" --keychain build.keychain "Deluge-${{ env.RESOLVED_APP_VERSION }}-Universal.dmg"

      - name: Notarize and Staple DMG
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          echo "Submitting installer package to Apple Notary Service..."

          # FIX: Explicitly consume the environment variable so the upload target matches the built asset perfectly
          SUBMISSION_OUT=$(xcrun notarytool submit "Deluge-${{ env.RESOLVED_APP_VERSION }}-Universal.dmg" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_PASSWORD" \
            --team-id "$TEAM_ID" \
            --wait 2>&1)

          echo "Notary API Server Response Log:"
          echo "$SUBMISSION_OUT"

          # Isolate unique submission token id
          SUBMISSION_ID=$(echo "$SUBMISSION_OUT" | awk '/id: / { print $2;exit; }')

          # Evaluate if rejection status was thrown back by Apple validators
          if echo "$SUBMISSION_OUT" | grep -q "status: Invalid" || [ -z "$SUBMISSION_ID" ]; then
            echo "❌ Apple Notary Service credentials or binary validation failed!"
            if [ ! -z "$SUBMISSION_ID" ]; then
              echo "Extracting comprehensive diagnostics logs..."
              xcrun notarytool log "$SUBMISSION_ID" --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --team-id "$TEAM_ID"
            fi
            exit 1
          fi

          # Securely affix approved cloud state ticket to the container filesystem layout
          xcrun stapler staple "Deluge-${{ env.RESOLVED_APP_VERSION }}-Universal.dmg"

      - name: Upload Finished DMG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Deluge-macOS-Universal
          path: Deluge-${{ env.RESOLVED_APP_VERSION }}-Universal.dmg

      - name: Verify Architecture Slices
        run: |
          echo "Checking application main binary binary structure..."
          lipo -info dist/Deluge.app/Contents/MacOS/Deluge

          echo "Checking native compiled Python extensions..."
          find dist/Deluge.app -name "*.so" -exec lipo -info {} \;
