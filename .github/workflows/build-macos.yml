name: Build and Notarize macOS DMG

on:
  push:
    tags:
      - 'deluge-*'
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch Git Tags Explicitly
        run: |
          git fetch --tags --force

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System Dependencies
        env:
          # Bypass Homebrew tap trust blocking warnings on the runner environment
          HOMEBREW_NO_REQUIRE_TAP_TRUST: 1
        run: |
          export MACOSX_DEPLOYMENT_TARGET=11.0
          export CFLAGS="-arch x86_64 -arch arm64 -mmacosx-version-min=11.0"
          export CXXFLAGS="-arch x86_64 -arch arm64 -mmacosx-version-min=11.0"
          export LDFLAGS="-arch x86_64 -arch arm64 -mmacosx-version-min=11.0"
          
          # Clean fallback list without forcing untracked third-party taps
          brew install --formula --build-from-source dylibbundler create-dmg gtk+3 adwaita-icon-theme libtorrent-rasterbar

      - name: Import Apple Developer Certificate
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE }}
          P12_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
          KEYCHAIN_PASSWORD: "temporary_actions_password"
        run: |
          # Create a temporary keychain to hold the certificate securely
          echo $BUILD_CERTIFICATE_BASE64 | base64 --decode --output certificate.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security import certificate.p12 -k build.keychain -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain

      - name: Create Entitlements File
        run: |
          cat <<EOF > entitlements.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://apple.com">
          <plist version="1.0">
          <dict>
              <key>com.apple.security.cs.allow-jit</key>
              <true/>
              <key>com.apple.security.cs.allow-unsigned-executable-memory</key>
              <true/>
              <key>com.apple.security.cs.disable-library-validation</key>
              <true/>
          </dict>
          </plist>
          EOF

      - name: Compile and Package App
        run: |
          export MACOSX_DEPLOYMENT_TARGET=11.0
          
          # Force clean cross-compilation parameters globally for python pip wheel compilation
          export CFLAGS="-arch arm64 -arch x86_64 -mmacosx-version-min=11.0 -O3"
          export LDFLAGS="-arch arm64 -arch x86_64 -mmacosx-version-min=11.0"
          
          pip install --upgrade pip setuptools wheel
          pip install pyinstaller

          # STEP 1: Download ONLY packages that natively publish fat universal2 wheels on PyPI
          mkdir -p universal_wheels
          pip download --platform macosx_11_0_universal2 --only-binary=:all: --no-deps -d universal_wheels \
            cryptography twisted setproctitle pyopenssl service-identity
          
          # Install the collected third-party fat wheels straight into your system execution tree
          pip install --force-reinstall --no-deps universal_wheels/*.whl

          # STEP 2: Compile cffi and zope.interface from source to build their true universal2 binary layers locally
          pip install --no-binary cffi,zope.interface --force-reinstall cffi zope.interface

          # Download rencode and compile it as a pure C extension without requiring Cython
          pip download --no-binary :all: --no-deps rencode
          tar -xf rencode-*.tar.gz
          cd rencode-*/
          
          # Delete their custom script and pyproject configurations completely
          # We need to do this as the default build hardcodes to x86 and we want universal
          # In the future if rencode is fixed all of this can be made more succint
          rm -f build.py pyproject.toml poetry.lock
          
          # Generate a setup script that compiles the pre-baked _rencode.c file directly
          cat <<EOF > setup.py
          from setuptools import setup, Extension
          setup(
              name="rencode",
              version="1.0.8",
              ext_modules=[Extension("rencode._rencode", ["rencode/_rencode.c"])],
              packages=["rencode"]
          )
          EOF
          
          python setup.py build_ext --inplace
          python setup.py install
          cd ..

          # DYNAMIC FIX 1: Check for the exact upstream deluge- tag format and strip the prefix
          if [[ "${{ github.ref }}" == refs/tags/deluge-* ]]; then
            RAW_VERSION="${{ github.ref_name }}"
            APP_VERSION="${RAW_VERSION#deluge-}"
          else
            # Smart baseline fallback for manual workflow_dispatch testing
            APP_VERSION="2.2.0"
          fi
          echo "RESOLVED_APP_VERSION=$APP_VERSION" >> $GITHUB_ENV
          echo "Using parsed dynamic version: $APP_VERSION"

          # DYNAMIC PATCH: Locate version.py wherever it lives in the workspace and force the return string
          find . -name "version.py" -exec sed -i '' "s/def get_version.*/def get_version(*args, **kwargs):\n    return '2.2.0'/g" {} +

          # Install Deluge with the forced static version patch (preserving your environment setup)
          pip install . --no-deps

          # Package universal binaries via PyInstaller pointing to the global executable path
          pyinstaller --noconfirm --onedir --windowed --name="Deluge" \
            --target-architecture universal2 \
            --add-data "deluge/ui/data:deluge/ui/data" \
            /Library/Frameworks/Python.framework/Versions/3.11/bin/deluge-gtk

          # Link non-python C libraries into the bundle
          dylibbundler -od -b -x dist/Deluge.app/Contents/MacOS/Deluge -d dist/Deluge.app/Contents/libs/

          # ====================================================================
          # THE DEFINITIVE CODESIGN FIX: Complete absolute bundle recursive sweep
          # ====================================================================
          echo "Executing comprehensive recursive application signing passes..."

          # Step 1: Force sign every single .so dynamic extension found anywhere inside the entire bundle structure
          find dist/Deluge.app -type f -name "*.so" -exec codesign --force --options runtime --timestamp --sign "${{ secrets.APPLE_DEVELOPER_IDENTITY }}" --keychain build.keychain {} \;

          # Step 2: Force sign every single .dylib shared object framework file found anywhere inside the app wrapper
          find dist/Deluge.app -type f -name "*.dylib" -exec codesign --force --options runtime --timestamp --sign "${{ secrets.APPLE_DEVELOPER_IDENTITY }}" --keychain build.keychain {} \;

          # Step 3: Sign the internal execution binaries explicitly
          find dist/Deluge.app/Contents/MacOS -type f -exec codesign --force --options runtime --timestamp --sign "${{ secrets.APPLE_DEVELOPER_IDENTITY }}" --keychain build.keychain {} \;

          # Step 4: Final deep validation seal anchoring the top-level app bundle container with your entitlements plist
          codesign --force --options runtime --deep --timestamp --sign "${{ secrets.APPLE_DEVELOPER_IDENTITY }}" --keychain build.keychain --entitlements entitlements.plist dist/Deluge.app

      - name: Build Outer DMG Installer
        run: |
          # 1. Generate the plain, raw disk image using create-dmg without internal script signing hooks
          create-dmg \
            --volname "Deluge Universal Installer" \
            --window-pos 200 120 \
            --window-size 800 400 \
            --icon-size 100 \
            --icon "Deluge.app" 200 190 \
            --app-drop-link 600 190 \
            "Deluge-${{ env.RESOLVED_APP_VERSION }}-Universal.dmg" \
            "dist/"

          # 2. Force-sign the generated outer DMG container via Apple's built-in codesign binary tool
          codesign --force --sign "${{ secrets.APPLE_DEVELOPER_IDENTITY }}" --keychain build.keychain "Deluge-${{ env.RESOLVED_APP_VERSION }}-Universal.dmg"

      - name: Notarize and Staple DMG
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # 1. Submit to Apple and capture the output log text to find the Submission ID
          SUBMISSION_OUT=$(xcrun notarytool submit "Deluge-${{ env.RESOLVED_APP_VERSION }}-Universal.dmg" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_PASSWORD" \
            --team-id "$TEAM_ID" \
            --wait 2>&1)
          
          echo "$SUBMISSION_OUT"
          
          # Extract the unique submission ID character string cleanly
          SUBMISSION_ID=$(echo "$SUBMISSION_OUT" | awk '/id: / { print $2;exit; }')
          
          # 2. Check if the notarization transaction was rejected by Apple's servers
          if echo "$SUBMISSION_OUT" | grep -q "status: Invalid"; then
            echo "❌ Apple Notary Service rejected the binary asset package!"
            echo "Fetching Apple's comprehensive diagnostic failure logs..."
            
            # Print the exact failure reasons directly into the GitHub Actions log console
            xcrun notarytool log "$SUBMISSION_ID" \
              --apple-id "$APPLE_ID" \
              --password "$APPLE_PASSWORD" \
              --team-id "$TEAM_ID"
            
            exit 1
          fi

          # 3. Staple the approved ticket only if the status clears successfully
          xcrun stapler staple "Deluge-${{ env.RESOLVED_APP_VERSION }}-Universal.dmg"

      - name: Upload Finished DMG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Deluge-macOS-Universal
          path: Deluge-2.2.0-Universal.dmg
