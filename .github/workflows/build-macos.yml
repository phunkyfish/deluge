name: Build and Notarize macOS DMG for Universal2

on:
  push:
    tags:
      - 'deluge-*'
  workflow_dispatch:

jobs:
  # ====================================================================
  # JOB 1 & 2: Build Thin Apps on Intel and Apple Silicon in Parallel
  # ====================================================================
  build-thin-apps:
    name: Build Thin App (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: x86_64
            runner: macos-26-intel
          - arch: arm64
            runner: macos-latest

    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
      ARCHFLAGS: "-arch ${{ matrix.arch }}"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch Git Tags Explicitly
        run: git fetch --tags --force

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install System Packaging Tools & Libtorrent
        env:
          HOMEBREW_NO_REQUIRE_TAP_TRUST: 1
          HOMEBREW_NO_ANALYTICS: 1
        run: |
          brew update
          brew install gtk+3 pango cairo glib gdk-pixbuf adwaita-icon-theme libtorrent-rasterbar gobject-introspection

      - name: Build and Package Thin App
        run: |
          python3 -m pip install --upgrade pip wheel "setuptools==81.0.0" pyinstaller

          # 1. Resolve application version
          if [[ "${{ github.ref }}" == refs/tags/deluge-* ]]; then
            RAW_VERSION="${{ github.ref_name }}"
            APP_VERSION="${RAW_VERSION#deluge-}"
          else
            APP_VERSION="2.2.0"
          fi
          echo "RESOLVED_APP_VERSION=$APP_VERSION" >> $GITHUB_ENV
          find . -name "version.py" -exec sed -i '' "s/def get_version.*/def get_version(*args, **kwargs):\n    return '${APP_VERSION}'/g" {} +

          # 2. Pre-install build dependencies directly into the main environment
          # Install build backends and pinned Cython directly into the environment
          python3 -m pip install "setuptools==81.0.0" "Cython<3.0" poetry-core wheel

          git clone --quiet https://github.com/aresch/rencode.git
          cd rencode
          git checkout --quiet e7ec8ea718e73a8fee7dbc007c262e1584f7f94b
          # Build rencode WITHOUT build isolation and strip processor-specific SSE flags
          ARCHFLAGS="-arch ${{ matrix.arch }}" python3 -m pip install --no-build-isolation .
          cd -

          # 1. Ensure PyGObject, PyCairo, and Deluge are fully installed in the build environment
          python3 -m pip install pygobject pycairo

          # Install deluge and remaining dependencies
          ARCHFLAGS="-arch ${{ matrix.arch }}" python3 -m pip install .

          # Extract libtorrent bindings from Homebrew
          BREW_PREFIX=$(brew --prefix)
          SITE_PACKAGES=$(python3 -c "import site; print(site.getsitepackages()[0])")
          cp -r $BREW_PREFIX/lib/python3.11/site-packages/libtorrent* "$SITE_PACKAGES/" 2>/dev/null || true

          file $SITE_PACKAGES/rencode/_rencode*.so

          # 3. Create setuptools 81+ NullProvider fix runtime hook
          cat <<'EOF' > fix_pkgres_hook.py
          import sys
          try:
              import pkg_resources
              if not hasattr(pkg_resources, 'NullProvider'):
                  class NullProvider:
                      def __init__(self, module):
                          self.module = module
                      def get_resource_filename(self, manager, resource_name): return ""
                      def get_resource_stream(self, manager, resource_name): return None
                      def get_resource_string(self, manager, resource_name): return b""
                      def has_resource(self, resource_name): return False
                      def is_resource(self, resource_name): return False
                      def resource_isdir(self, resource_name): return False
                      def resource_listdir(self, resource_name): return []
                  pkg_resources.NullProvider = NullProvider

              if not hasattr(pkg_resources, 'register_loader_type'):
                  pkg_resources.register_loader_type = lambda loader, provider: None
          except Exception:
              pass
          EOF

          # 4. Generate GI runtime hook
          cat <<'EOF' > gi_runtime_hook.py
          import os
          import sys
          import ctypes

          bundle_dir = getattr(sys, '_MEIPASS', os.path.dirname(os.path.abspath(__file__)))
          frameworks_dir = os.path.abspath(os.path.join(bundle_dir, '..', 'Frameworks'))
          resources_dir = os.path.abspath(os.path.join(bundle_dir, '..', 'Resources'))

          if not os.path.exists(frameworks_dir): frameworks_dir = bundle_dir
          if not os.path.exists(resources_dir): resources_dir = bundle_dir

          for dylib in os.listdir(frameworks_dir):
              if dylib.endswith('.dylib'):
                  try: ctypes.CDLL(os.path.join(frameworks_dir, dylib))
                  except Exception: pass

          os.environ['DYLD_FALLBACK_LIBRARY_PATH'] = f"{frameworks_dir}:{os.environ.get('DYLD_FALLBACK_LIBRARY_PATH', '')}"
          os.environ['DYLD_LIBRARY_PATH'] = f"{frameworks_dir}:{os.environ.get('DYLD_LIBRARY_PATH', '')}"
          os.environ['GI_TYPELIB_PATH'] = f"{resources_dir}/gi_typelibs:{bundle_dir}/gi_typelibs:{os.environ.get('GI_TYPELIB_PATH', '')}"
          os.environ['GSETTINGS_SCHEMA_DIR'] = os.path.join(resources_dir, 'glib-2.0', 'schemas')
          os.environ['XDG_DATA_DIRS'] = f"{resources_dir}:{os.environ.get('XDG_DATA_DIRS', '/usr/local/share:/usr/share')}"
          EOF

          # 5. Synthesize bootstrapper entrypoint
          cat <<'EOF' > run_deluge.py
          import builtins
          import gettext

          try:
              trans = gettext.translation('deluge', fallback=True)
              builtins._ = trans.gettext
          except Exception:
              builtins._ = lambda msg: msg

          if '_' not in builtins.__dict__:
              builtins.__dict__['_'] = lambda msg: msg

          from deluge.ui.gtk3.gtkui import GtkUI

          def start():
              ui = GtkUI()
              ui.start()

          if __name__ == '__main__':
              start()
          EOF

          TARGET_LIBS=(
            "libgtk-3" "libgdk-3" "libpango" "libcairo" "libglib-2.0"
            "libgio-2.0" "libgobject-2.0" "libgdk_pixbuf" "libatk-1.0"
            "libharfbuzz" "libepoxy" "libfribidi" "libintl" "libpng"
          )

          BINARIES_ARG=()
          for lib_prefix in "${TARGET_LIBS[@]}"; do
            for matched_lib in "$BREW_PREFIX"/lib/${lib_prefix}*.dylib "$BREW_PREFIX"/opt/*/lib/${lib_prefix}*.dylib; do
              if [ -f "$matched_lib" ]; then
                BINARIES_ARG+=(--add-binary "$matched_lib:.")
              fi
            done
          done

          # 2. Export dynamic library search paths so PyInstaller child processes can resolve GI typelibs
          export DYLD_LIBRARY_PATH="$BREW_PREFIX/lib:$BREW_PREFIX/opt/gtk+3/lib:$BREW_PREFIX/opt/pango/lib:$BREW_PREFIX/opt/cairo/lib:$BREW_PREFIX/opt/glib/lib:$DYLD_LIBRARY_PATH"
          export DYLD_FALLBACK_LIBRARY_PATH="$BREW_PREFIX/lib:$DYLD_FALLBACK_LIBRARY_PATH"

          # 2. Add Homebrew binaries to PATH so PyInstaller can execute g-ir-compiler
          export PATH="$BREW_PREFIX/bin:$PATH"

          # 6. Generate spec file and compile thin app
          pyi-makespec --onedir --windowed --name="Deluge" \
            --runtime-hook=fix_pkgres_hook.py \
            --runtime-hook=gi_runtime_hook.py \
            -i "deluge/ui/data/pixmaps/deluge.icns" \
            "${BINARIES_ARG[@]}" \
            --exclude-module=PIL \
            --exclude-module=Pillow \
            --exclude-module=tkinter \
            --collect-all gi \
            --collect-all deluge \
            --collect-all twisted \
            --collect-all zope.interface \
            --hidden-import=libtorrent \
            --hidden-import=pkg_resources \
            --hidden-import=setuptools \
            --add-data "$SITE_PACKAGES/deluge/ui/data:deluge/ui/data" \
            --add-data "$BREW_PREFIX/lib/girepository-1.0:gi_typelibs" \
            --osx-bundle-identifier="org.deluge-torrent.deluge" \
            run_deluge.py

          pyinstaller --clean Deluge.spec

          # 3. Inject minimal resources (skip heavy locale translations)
          APP_RESOURCES="dist/Deluge.app/Contents/Resources"
          mkdir -p "$APP_RESOURCES/girepository-1.0" "$APP_RESOURCES/share/glib-2.0/schemas" "$APP_RESOURCES/share/icons"

          cp -fv "$BREW_PREFIX"/lib/girepository-1.0/*.typelib "$APP_RESOURCES/girepository-1.0/" 2>/dev/null || true
          cp -fv "$BREW_PREFIX/share/glib-2.0/schemas"/*.xml "$APP_RESOURCES/share/glib-2.0/schemas/"
          glib-compile-schemas "$APP_RESOURCES/share/glib-2.0/schemas/"

          # Copy icon directories without SVG sources where possible
          [ -d "$BREW_PREFIX/share/icons/hicolor" ] && cp -R "$BREW_PREFIX/share/icons/hicolor" "$APP_RESOURCES/share/icons/"

          # 4. STRIP BINARIES (Major Size Reduction Step)
          echo "=== Stripping Debug Symbols ==="
          find dist/Deluge.app -type f \( -name "*.dylib" -o -name "*.so" -o -name "Deluge" \) | while read -r bin; do
            strip -x "$bin" 2>/dev/null || true
          done

          # 5. Clean unnecessary pyinstaller bloat inside app bundle
          find dist/Deluge.app -type d \( -name "__pycache__" -o -name "tests" -o -name "test" \) -exec rm -rf {} + 2>/dev/null || true

      - name: Upload Thin App Build
        uses: actions/upload-artifact@v4
        with:
          name: deluge-thin-${{ matrix.arch }}
          path: dist/Deluge.app

  # ====================================================================
  # JOB 3: Merge Architecture Artifacts into Universal 2
  # ====================================================================
  create-universal-app:
    name: Stitch & Package Universal2 DMG
    needs: build-thin-apps
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Intel Build
        uses: actions/download-artifact@v4
        with:
          name: deluge-thin-x86_64
          path: builds/x86_64/Deluge.app

      - name: Download Arm64 Build
        uses: actions/download-artifact@v4
        with:
          name: deluge-thin-arm64
          path: builds/arm64/Deluge.app

      - name: Install Packaging Tools
        run: brew install create-dmg

      - name: Import Apple Developer Certificate
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE }}
          P12_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
          KEYCHAIN_PASSWORD: "temporary_actions_password"
        run: |
          echo $BUILD_CERTIFICATE_BASE64 | base64 --decode --output certificate.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security import certificate.p12 -k build.keychain -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain

      - name: Create Entitlements File
        run: |
          cat <<EOF > entitlements.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://apple.com">
          <plist version="1.0">
          <dict>
              <key>com.apple.security.cs.allow-jit</key>
              <true/>
              <key>com.apple.security.cs.allow-unsigned-executable-memory</key>
              <true/>
              <key>com.apple.security.cs.disable-library-validation</key>
              <true/>
          </dict>
          </plist>
          EOF

      - name: Stitch Universal2 App Bundle
        run: |
          # 1. Base the layout on the arm64 build
          mkdir -p dist
          cp -R builds/arm64/Deluge.app dist/Deluge.app

          INTEL_APP="builds/x86_64/Deluge.app"
          ARM_APP="builds/arm64/Deluge.app"
          FINAL_APP="dist/Deluge.app"

          # 2. Lipo stitch main executable
          lipo -create \
            "$INTEL_APP/Contents/MacOS/Deluge" \
            "$ARM_APP/Contents/MacOS/Deluge" \
            -output "$FINAL_APP/Contents/MacOS/Deluge"

          # 3. Lipo stitch all compiled libraries (.dylib and .so)
          find "$FINAL_APP/Contents/Frameworks" -type f \( -name "*.dylib" -o -name "*.so" \) | while read -r target_lib; do
            rel_path="${target_lib#$FINAL_APP/}"
            intel_lib="$INTEL_APP/$rel_path"
            arm_lib="$ARM_APP/$rel_path"

            if [ -f "$intel_lib" ] && [ -f "$arm_lib" ]; then
              # Only lipo if both files are Mach-O binaries
              if file "$intel_lib" | grep -q "Mach-O"; then
                lipo -create "$intel_lib" "$arm_lib" -output "$target_lib"
              fi
            fi
          done

          # 4. Clean up dangling symlinks
          find "$FINAL_APP" -type l ! -exec test -e {} \; -delete
          chmod -R 755 "$FINAL_APP"

      - name: Sign Universal2 App Bundle
        run: |
          FINAL_APP="$GITHUB_WORKSPACE/dist/Deluge.app"

          security set-keychain-settings -lut 7200 build.keychain
          security unlock-keychain -p "temporary_actions_password" build.keychain

      - name: Sign Universal2 App Bundle
        run: |
          FINAL_APP="$GITHUB_WORKSPACE/dist/Deluge.app"

          security set-keychain-settings -lut 7200 build.keychain
          security unlock-keychain -p "temporary_actions_password" build.keychain

          # 1. Sweep non-Mach-O data directories and files out of Frameworks/MacOS to Resources
          mkdir -p "$FINAL_APP/Contents/Resources"
          mkdir -p "$FINAL_APP/Contents/MacOS"

          # Move non-Mach-O directories (deluge, gi_typelibs, etc.) to Resources
          find "$FINAL_APP/Contents/Frameworks" -mindepth 1 -maxdepth 1 -type d | while read -r dir; do
            dirname=$(basename "$dir")
            if [[ "$dirname" != *"Python"* ]]; then
              echo "=== Relocating resource directory: $dirname ==="
              cp -R "$dir/" "$FINAL_APP/Contents/Resources/$dirname/"
              rm -rf "$dir"
            fi
          done

          # Move base_library.zip to Resources and symlink it back to MacOS for the bootloader
          if [ -f "$FINAL_APP/Contents/Frameworks/base_library.zip" ] || [ -f "$FINAL_APP/Contents/MacOS/base_library.zip" ]; then
            echo "=== Relocating base_library.zip to Resources & symlinking to MacOS ==="
            rm -f "$FINAL_APP/Contents/MacOS/base_library.zip"
            [ -f "$FINAL_APP/Contents/Frameworks/base_library.zip" ] && mv "$FINAL_APP/Contents/Frameworks/base_library.zip" "$FINAL_APP/Contents/Resources/base_library.zip"

            # Create relative symlink in MacOS/ pointing to Resources/
            ln -s "../Resources/base_library.zip" "$FINAL_APP/Contents/MacOS/base_library.zip"
          fi

          # Move any remaining non-Mach-O loose files to Resources
          find "$FINAL_APP/Contents/Frameworks" -mindepth 1 -maxdepth 1 -type f | while read -r file; do
            if ! file "$file" | grep -q "Mach-O"; then
              filename=$(basename "$file")
              echo "=== Relocating non-Mach-O file: $filename ==="
              mv "$file" "$FINAL_APP/Contents/Resources/$filename"
            fi
          done

          # 2. Purge non-binary metadata files that break bundle checks
          find "$FINAL_APP/Contents/Frameworks" "$FINAL_APP/Contents/Resources" -type f \( -name "*.py" -o -name "*.pyc" -o -name "*.txt" -o -name "*.json" \) -delete 2>/dev/null || true
          find "$FINAL_APP/Contents/Frameworks" "$FINAL_APP/Contents/Resources" -type d \( -name "*.dist-info" -o -name "*.egg-info" -o -name "__pycache__" \) -exec rm -rf {} + 2>/dev/null || true

          # 3. Extract Python binary and obliterate the Python.framework folder
          find "$FINAL_APP" -type d -name "Python.framework" | while read -r py_fw; do
            echo "=== Completely removing Python.framework shell at: $py_fw ==="
            PY_BIN=$(find "$py_fw" -name "Python" -type f | head -n 1)
            TARGET_DIR=$(dirname "$py_fw")
            LIB_NAME="libpython3.11.dylib"

            if [ -n "$PY_BIN" ]; then
              # Copy the actual binary to the root Frameworks dir as a plain .dylib
              cp "$PY_BIN" "$TARGET_DIR/$LIB_NAME"
            fi

            # Obliterate the entire .framework directory tree so codesign never sees the name
            rm -rf "$py_fw"
          done

          # 4. Sign ALL inner Mach-O binaries first (Frameworks, Resources, and nested MacOS binaries)
          find "$FINAL_APP/Contents/Frameworks" "$FINAL_APP/Contents/Resources" "$FINAL_APP/Contents/MacOS" -type f | while read -r file; do
            # Skip the main binary for the final step
            if [ "$file" = "$FINAL_APP/Contents/MacOS/Deluge" ]; then
              continue
            fi

            # Skip symbolic links
            if [ -L "$file" ]; then
              continue
            fi

            if file "$file" | grep -q "Mach-O"; then
              echo "=== Signing Mach-O Binary: $file ==="
              codesign --force --options runtime --timestamp \
                --sign "${{ secrets.APPLE_DEVELOPER_IDENTITY }}" \
                --keychain build.keychain "$file"
            fi
          done

          # 5. Sign main Deluge executable with entitlements
          echo "=== Signing Main Executable ==="
          codesign --force --options runtime --timestamp --entitlements entitlements.plist \
            --sign "${{ secrets.APPLE_DEVELOPER_IDENTITY }}" --keychain build.keychain \
            "$FINAL_APP/Contents/MacOS/Deluge"

          # 6. Deep-sign top-level App Bundle
          echo "=== Signing Outer Application Bundle ==="
          codesign --force --deep --options runtime --timestamp --entitlements entitlements.plist \
            --sign "${{ secrets.APPLE_DEVELOPER_IDENTITY }}" --keychain build.keychain \
            "$FINAL_APP"

          # 7. Strict Gatekeeper Verification
          echo "=== Verifying Signature ==="
          codesign --verify --verbose=4 --strict "$FINAL_APP"

      - name: Verify Architecture Slices
        run: |
          echo "=== Main Binary Slices ==="
          lipo -info dist/Deluge.app/Contents/MacOS/Deluge

          echo "=== C Extensions Slices (sample) ==="
          find dist/Deluge.app -name "_rencode*.so" -exec lipo -info {} \;

      - name: Build Outer DMG Installer
        run: |
          if [[ "${{ github.ref }}" == refs/tags/deluge-* ]]; then
            RAW_VERSION="${{ github.ref_name }}"
            APP_VERSION="${RAW_VERSION#deluge-}"
          else
            APP_VERSION="2.2.0"
          fi
          echo "RESOLVED_APP_VERSION=$APP_VERSION" >> $GITHUB_ENV

          mkdir -p secure_dmg_staging
          ditto $GITHUB_WORKSPACE/dist/Deluge.app secure_dmg_staging/Deluge.app

          create-dmg \
            --volname "Deluge Universal Installer" \
            --window-pos 200 120 \
            --window-size 800 400 \
            --icon-size 100 \
            --icon "Deluge.app" 200 190 \
            --app-drop-link 600 190 \
            "Deluge-${APP_VERSION}-Universal.dmg" \
            "secure_dmg_staging/"

          codesign --force --sign "${{ secrets.APPLE_DEVELOPER_IDENTITY }}" --keychain build.keychain "Deluge-${APP_VERSION}-Universal.dmg"

      - name: Notarize and Staple DMG
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          DMG_NAME="Deluge-${{ env.RESOLVED_APP_VERSION }}-Universal.dmg"

          SUBMISSION_OUT=$(xcrun notarytool submit "$DMG_NAME" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_PASSWORD" \
            --team-id "$TEAM_ID" \
            --wait 2>&1)

          echo "$SUBMISSION_OUT"
          SUBMISSION_ID=$(echo "$SUBMISSION_OUT" | awk '/id: / { print $2;exit; }')

          if echo "$SUBMISSION_OUT" | grep -q "status: Invalid" || [ -z "$SUBMISSION_ID" ]; then
            xcrun notarytool log "$SUBMISSION_ID" --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --team-id "$TEAM_ID"
            exit 1
          fi

          xcrun stapler staple "$DMG_NAME"

      - name: Upload Finished DMG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Deluge-macOS-Universal
          path: Deluge-${{ env.RESOLVED_APP_VERSION }}-Universal.dmg
