name: Build and Notarize macOS DMG for Universal2

on:
  push:
    tags:
      - 'deluge-*'
  workflow_dispatch:

jobs:
  # ====================================================================
  # JOB 1 & 2: Build Thin Apps on Intel and Apple Silicon in Parallel
  # ====================================================================
  build-thin-apps:
    name: Build Thin App (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: x86_64
            runner: macos-26-intel
          - arch: arm64
            runner: macos-latest

    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
      ARCHFLAGS: "-arch ${{ matrix.arch }}"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch Git Tags Explicitly
        run: git fetch --tags --force

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install System Packaging Tools & Libtorrent
        env:
          HOMEBREW_NO_REQUIRE_TAP_TRUST: 1
          HOMEBREW_NO_ANALYTICS: 1
          HOMEBREW_NO_AUTO_UPDATE: 1
          HOMEBREW_NO_INSTALL_CLEANUP: 1
        run: |
          brew install gtk+3 pango cairo glib gdk-pixbuf adwaita-icon-theme libtorrent-rasterbar gobject-introspection

      - name: Build and Package Thin App
        run: |
          python3 -m pip install --upgrade pip wheel "setuptools==81.0.0" pyinstaller

          echo "Python version being used on runner XXX"
          python --version
          python3 --version

          echo "Python Installer version being used on runner target XXX"
          python -m pip show pyinstaller
          python -u -c "import sys; print('PyInstaller will target:', sys.version)"

          # 1. Resolve application version
          if [[ "${{ github.ref }}" == refs/tags/deluge-* ]]; then
            RAW_VERSION="${{ github.ref_name }}"
            APP_VERSION="${RAW_VERSION#deluge-}"
          else
            APP_VERSION="2.2.0"
          fi
          echo "RESOLVED_APP_VERSION=$APP_VERSION" >> $GITHUB_ENV
          find . -name "version.py" -exec sed -i '' "s/def get_version.*/def get_version(*args, **kwargs):\n    return '${APP_VERSION}'/g" {} +

          # 2. Pre-install build dependencies directly into the main environment
          python3 -m pip install "setuptools==81.0.0" "Cython<3.0" poetry-core wheel

          git clone --quiet https://github.com/aresch/rencode.git
          cd rencode
          git checkout --quiet e7ec8ea718e73a8fee7dbc007c262e1584f7f94b
          ARCHFLAGS="-arch ${{ matrix.arch }}" python3 -m pip install --no-build-isolation .
          cd -

          python3 -m pip install pygobject pycairo
          ARCHFLAGS="-arch ${{ matrix.arch }}" python3 -m pip install .

          # Extract libtorrent bindings from Homebrew
          BREW_PREFIX=$(brew --prefix)
          SITE_PACKAGES=$(python3 -c "import site; print(site.getsitepackages()[0])")
          cp -r $BREW_PREFIX/lib/python3.11/site-packages/libtorrent* "$SITE_PACKAGES/" 2>/dev/null || true

          file $SITE_PACKAGES/rencode/_rencode*.so

          # 3. Create setuptools 81+ NullProvider fix runtime hook
          cat <<'EOF' > fix_pkgres_hook.py
          import sys
          try:
              import pkg_resources
              if not hasattr(pkg_resources, 'NullProvider'):
                  class NullProvider:
                      def __init__(self, module):
                          self.module = module
                      def get_resource_filename(self, manager, resource_name): return ""
                      def get_resource_stream(self, manager, resource_name): return None
                      def get_resource_string(self, manager, resource_name): return b""
                      def has_resource(self, resource_name): return False
                      def is_resource(self, resource_name): return False
                      def resource_isdir(self, resource_name): return False
                      def resource_listdir(self, resource_name): return []
                  pkg_resources.NullProvider = NullProvider

              if not hasattr(pkg_resources, 'register_loader_type'):
                  pkg_resources.register_loader_type = lambda loader, provider: None
          except Exception:
              pass
          EOF

          # 4. Generate Cleaned GI runtime hook
          cat <<'EOF' > gi_runtime_hook.py
          import os
          import sys
          import ctypes

          bundle_dir = getattr(sys, '_MEIPASS', os.path.dirname(os.path.abspath(__file__)))
          frameworks_dir = os.path.abspath(os.path.join(bundle_dir, '..', 'Frameworks'))
          resources_dir = os.path.abspath(os.path.join(bundle_dir, '..', 'Resources'))

          # Load dynamic libraries
          search_paths = [bundle_dir, frameworks_dir]
          for search_path in search_paths:
              if os.path.exists(search_path):
                  for dylib in os.listdir(search_path):
                      if dylib.endswith('.dylib'):
                          try: ctypes.CDLL(os.path.join(search_path, dylib))
                          except Exception: pass

          pixbuf_cache = os.path.join(resources_dir, 'lib', 'gdk-pixbuf-2.0', '2.10.0', 'loaders.cache')
          pixbuf_loader_dir = os.path.join(resources_dir, 'lib', 'gdk-pixbuf-2.0', '2.10.0', 'loaders')

          if os.path.exists(pixbuf_cache):
              os.environ['GDK_PIXBUF_MODULE_FILE'] = pixbuf_cache
              os.environ['GDK_PIXBUF_MODULEDIR'] = pixbuf_loader_dir

          path_str = ":".join(search_paths)
          os.environ['DYLD_FALLBACK_LIBRARY_PATH'] = f"{path_str}:{os.environ.get('DYLD_FALLBACK_LIBRARY_PATH', '')}"
          os.environ['DYLD_LIBRARY_PATH'] = f"{path_str}:{os.environ.get('DYLD_LIBRARY_PATH', '')}"
          os.environ['GI_TYPELIB_PATH'] = f"{resources_dir}/gi_typelibs:{os.environ.get('GI_TYPELIB_PATH', '')}"
          os.environ['GSETTINGS_SCHEMA_DIR'] = os.path.join(resources_dir, 'glib-2.0', 'schemas')
          os.environ['XDG_DATA_DIRS'] = f"{resources_dir}:{os.environ.get('XDG_DATA_DIRS', '/usr/local/share:/usr/share')}"

          # Unset host Homebrew library paths during runtime initialization
          os.environ['DYLD_LIBRARY_PATH'] = frameworks_dir
          EOF

          # 5. Synthesize bootstrapper entrypoint
          cat <<'EOF' > run_deluge.py
          import sys
          import builtins
          import gettext

          try:
              trans = gettext.translation('deluge', fallback=True)
              builtins._ = trans.gettext
          except Exception:
              builtins._ = lambda msg: msg

          if '_' not in builtins.__dict__:
              builtins.__dict__['_'] = lambda msg: msg

          from deluge.ui.gtk3.gtkui import GtkUI
          import argparse

          def start():
              # Create a mock namespace with an empty torrents list
              args = argparse.Namespace(torrents=[])
              ui = GtkUI(args)
              ui.start()

          if __name__ == '__main__':
              start()
          EOF

          export DYLD_LIBRARY_PATH="$BREW_PREFIX/lib:$BREW_PREFIX/opt/gtk+3/lib:$BREW_PREFIX/opt/pango/lib:$BREW_PREFIX/opt/cairo/lib:$BREW_PREFIX/opt/glib/lib:$DYLD_LIBRARY_PATH"
          export DYLD_FALLBACK_LIBRARY_PATH="$BREW_PREFIX/lib:$DYLD_FALLBACK_LIBRARY_PATH"
          export PATH="$BREW_PREFIX/bin:$PATH"

          # 6. Generate spec file and compile thin app (Cleaned pyi-makespec)
          pyi-makespec --onedir --windowed --name="Deluge" \
            --runtime-hook=fix_pkgres_hook.py \
            --runtime-hook=gi_runtime_hook.py \
            -i "deluge/ui/data/pixmaps/deluge.icns" \
            --exclude-module=PIL \
            --exclude-module=Pillow \
            --exclude-module=tkinter \
            --exclude-module=twisted.trial \
            --collect-all=deluge \
            --collect-binaries=gi \
            --collect-binaries=cairo \
            --collect-submodules=gi \
            --collect-data=deluge \
            --collect-submodules=twisted \
            --collect-submodules=zope.interface \
            --hidden-import=libtorrent \
            --hidden-import=pkg_resources \
            --hidden-import=setuptools \
            --add-binary "$BREW_PREFIX/lib/libgtk-3.dylib:." \
            --add-binary "$BREW_PREFIX/lib/libgdk-3.dylib:." \
            --add-data "$SITE_PACKAGES/deluge/ui/data:deluge/ui/data" \
            --add-data "$BREW_PREFIX/lib/girepository-1.0:gi_typelibs" \
            --osx-bundle-identifier="org.deluge-torrent.deluge" \
            run_deluge.py

          # Patch Deluge.spec to include logging, asyncio, gettext, xml inside Analysis.datas
          python3.11 -c "
          import sysconfig, os, site

          spec_path = 'Deluge.spec'
          stdlib = sysconfig.get_path('stdlib')
          site_pkgs = site.getsitepackages()[0]
          lib_dynload = os.path.join(stdlib, 'lib-dynload')

          ignored_dirs = {'__pycache__', 'test', 'tests', 'idlelib', 'tkinter', 'turtledemo', 'pip', 'wheel'}
          ignored_exts = ('.a', '.o', '.pyc')

          extra_datas = []

          # 1. Walk pure Python stdlib modules
          for root, dirs, files in os.walk(stdlib):
              dirs[:] = [d for d in dirs if d not in ignored_dirs and d != 'site-packages' and d != 'lib-dynload' and not d.startswith('config-')]
              for f in files:
                  if f.endswith(ignored_exts) or f.endswith('.so') or f.endswith('.dylib'):
                      continue
                  full_p = os.path.join(root, f)
                  rel_p = os.path.relpath(full_p, stdlib)
                  dest_dir = os.path.dirname(rel_p)
                  extra_datas.append((full_p, dest_dir if dest_dir else '.'))

          # 2. Explicitly include stdlib C-extensions (_struct, _json, _ssl, etc.) from lib-dynload
          if os.path.exists(lib_dynload):
              for f in os.listdir(lib_dynload):
                  if f.endswith('.so'):
                      full_p = os.path.join(lib_dynload, f)
                      extra_datas.append((full_p, '.'))

          # 3. Walk site-packages (twisted, zope, deluge, pkg_resources, setuptools, etc.)
          if os.path.exists(site_pkgs):
              for root, dirs, files in os.walk(site_pkgs):
                  dirs[:] = [d for d in dirs if d not in ignored_dirs and not d.endswith('.dist-info') and not d.endswith('.egg-info')]
                  for f in files:
                      if f.endswith(ignored_exts):
                          continue
                      full_p = os.path.join(root, f)
                      rel_p = os.path.relpath(full_p, site_pkgs)
                      dest_dir = os.path.dirname(rel_p)
                      extra_datas.append((full_p, dest_dir if dest_dir else '.'))

          with open(spec_path, 'r') as f:
              content = f.read()

          # Insert extra_datas definition right before Analysis()
          injection = f'extra_datas = {extra_datas}\n'
          content = content.replace('a = Analysis(', injection + 'a = Analysis(')
          content = content.replace('datas=datas,', 'datas=datas + extra_datas,')

          with open(spec_path, 'w') as f:
              f.write(content)
          "

          pyinstaller --clean Deluge.spec

          APP_RESOURCES="dist/Deluge.app/Contents/Resources"
          APP_FRAMEWORKS="dist/Deluge.app/Contents/Frameworks"

          mkdir -p "$APP_RESOURCES/girepository-1.0" \
                   "$APP_RESOURCES/share/glib-2.0/schemas" \
                   "$APP_RESOURCES/share/icons" \
                   "$APP_RESOURCES/lib/gdk-pixbuf-2.0/2.10.0"

          cp -fv "$BREW_PREFIX"/lib/girepository-1.0/*.typelib "$APP_RESOURCES/girepository-1.0/" 2>/dev/null || true
          cp -fv "$BREW_PREFIX/share/glib-2.0/schemas"/*.xml "$APP_RESOURCES/share/glib-2.0/schemas/"
          glib-compile-schemas "$APP_RESOURCES/share/glib-2.0/schemas/"

          # 1. Copy icon themes
          if [ -d "$BREW_PREFIX/share/icons" ]; then
            cp -R "$BREW_PREFIX/share/icons/"* "$APP_RESOURCES/share/icons/" 2>/dev/null || true
          fi

          # 2. Copy SVG loader modules and librsvg
          cp -fv "$BREW_PREFIX"/lib/gdk-pixbuf-2.0/2.10.0/loaders/*.so "$APP_FRAMEWORKS/" 2>/dev/null || true
          cp -fv "$BREW_PREFIX"/lib/librsvg*.dylib "$APP_FRAMEWORKS/" 2>/dev/null || true

          # 3. Build loaders.cache against Frameworks binaries
          LOADERS_CACHE="$APP_RESOURCES/lib/gdk-pixbuf-2.0/2.10.0/loaders.cache"
          gdk-pixbuf-query-loaders "$APP_FRAMEWORKS"/*.so > "$LOADERS_CACHE"

          # Fix paths inside loaders.cache without messing up syntax or internal quotes
          python3 -c "
          import os

          cache_p = '$LOADERS_CACHE'
          with open(cache_p, 'r') as f:
              lines = f.readlines()

          with open(cache_p, 'w') as f:
              for line in lines:
                  if line.startswith('\"'):
                      # Extract full path inside outer quotes
                      path = line.split('\"')[1]
                      filename = os.path.basename(path)
                      rest_of_line = line[len(path) + 2:]
                      f.write(f'\"@executable_path/../Frameworks/{filename}\"{rest_of_line}')
                  else:
                      f.write(line)
          "

          # STRIP BINARIES
          echo "=== Stripping Debug Symbols ==="
          find dist/Deluge.app -type f \( -name "*.dylib" -o -name "*.so" -o -name "Deluge" \) | while read -r bin; do
            strip -x "$bin" 2>/dev/null || true
          done

          # Clean unnecessary pyinstaller bloat inside app bundle
          find dist/Deluge.app -type d \( -name "__pycache__" -o -name "tests" -o -name "test" \) -exec rm -rf {} + 2>/dev/null || true

      - name: Export PyInstaller Raw Bootloader Template
        run: |
          echo "=== Exporting Raw PyInstaller Bootloader Template ==="
          PYI_DIR=$(python3 -c "import PyInstaller; import os; print(os.path.dirname(PyInstaller.__file__))")

          RUNW_BIN=$(find "$PYI_DIR/bootloader" -name "runw" | head -n 1)

          DETECTED_ARCH=$(file -b "$RUNW_BIN")
          echo "Expected arch: ${{ matrix.arch }}"
          echo "Detected arch: $DETECTED_ARCH"
          echo "Source bootloader: $RUNW_BIN"

          cp "$RUNW_BIN" "$GITHUB_WORKSPACE/dist/runw_${{ matrix.arch }}"

      - name: Archive Thin App Bundle (Preserves Symlinks)
        run: |
          cd dist
          tar -cf "../deluge-thin-${{ matrix.arch }}.tar" Deluge.app "runw_${{ matrix.arch }}"

      - name: Upload Thin App Build
        uses: actions/upload-artifact@v4
        with:
          name: deluge-thin-${{ matrix.arch }}
          path: deluge-thin-${{ matrix.arch }}.tar
          include-hidden-files: true

  # ====================================================================
  # JOB 3: Merge Architecture Artifacts into Universal 2
  # ====================================================================
  create-universal-app:
    name: Stitch & Package Universal2 DMG
    needs: build-thin-apps
    runs-on: macos-latest
    env:
      FINAL_APP: "${{ github.workspace }}/dist/Deluge.app"
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch Git Tags Explicitly
        run: git fetch --tags --force

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install PyInstaller and Spec Build Dependencies
        run: |
          python3 -m pip install --upgrade pip wheel "setuptools==81.0.0" pyinstaller
          python3 -m pip install "Cython<3.0" poetry-core pygobject pycairo

          echo "Python version being used on runner XXX"
          python --version
          python3 --version

          echo "Python Installer version being used on runner target XXX"
          python -m pip show pyinstaller
          python -c "import sys; print('PyInstaller will target:', sys.version)"

          if [[ "${{ github.ref }}" == refs/tags/deluge-* ]]; then
            APP_VERSION="${GITHUB_REF_NAME#deluge-}"
          else
            APP_VERSION="2.2.0"
          fi
          find . -name "version.py" -exec sed -i '' "s/def get_version.*/def get_version(*args, **kwargs):\n    return '${APP_VERSION}'/g" {} +

          python3 -m pip install --no-build-isolation --no-deps -e .

      - name: Download Thin App Artifacts
        uses: actions/download-artifact@v4
        with:
          path: /tmp/thin_builds

      - name: Extract Thin App Bundles
        run: |
          mkdir -p /tmp/thin_builds/arm64_extracted
          mkdir -p /tmp/thin_builds/x86_extracted

          tar -xf /tmp/thin_builds/deluge-thin-arm64/deluge-thin-arm64.tar -C /tmp/thin_builds/arm64_extracted
          tar -xf /tmp/thin_builds/deluge-thin-x86_64/deluge-thin-x86_64.tar -C /tmp/thin_builds/x86_extracted

      - name: Verify Artifact Integrity & Counts
        run: |
          ARM_APP="/tmp/thin_builds/arm64_extracted/Deluge.app"

          if [ ! -d "$ARM_APP" ]; then
            echo "Error: $ARM_APP not found for verification!"
            exit 1
          fi

          echo "=================================================="
          echo "       THIN APP ARTIFACT HEALTH INVENTORY         "
          echo "=================================================="

          BUNDLE_SIZE=$(du -sh "$ARM_APP" | cut -f1)
          TOTAL_SYMLINKS=$(find "$ARM_APP" -type l | wc -l | tr -d ' ')
          TOTAL_FILES=$(find "$ARM_APP" -type f | wc -l | tr -d ' ')

          echo "Total Bundle Size : $BUNDLE_SIZE"
          echo "Total Physical Files: $TOTAL_FILES"
          echo "Total Symlinks      : $TOTAL_SYMLINKS"
          echo "--------------------------------------------------"

          count_breakdown() {
            local ext="$1"
            local label="$2"
            local real_files=$(find "$ARM_APP" -type f -name "*$ext" ! -type l | wc -l | tr -d ' ')
            local symlinks=$(find "$ARM_APP" -type l -name "*$ext" | wc -l | tr -d ' ')
            printf "%-12s | Real Files: %-5s | Symlinks: %-5s\n" "$label" "$real_files" "$symlinks"
          }

          echo "FILE TYPE BREAKDOWN:"
          count_breakdown ".dylib" ".dylib"
          count_breakdown ".so"    ".so"
          count_breakdown ".pyc"   ".pyc"

          echo "--------------------------------------------------"
          echo "SAMPLE SYMLINK TARGETS (.dylib):"
          find "$ARM_APP" -type l -name "*.dylib" | head -n 5 | while read -r link; do
            target=$(readlink "$link")
            echo "  ${link#$ARM_APP/} -> $target"
          done
          echo "=================================================="

          if [ "$TOTAL_SYMLINKS" -eq 0 ]; then
            echo "CRITICAL ERROR: Symlinks count is 0! Artifact dereferencing has recurred."
            exit 1
          fi

      - name: Install Packaging Tools
        run: brew install create-dmg

      - name: Stitch Thin Architectures into Universal2 Bundle
        run: |
          # 1. Clean workspace
          rm -rf "$FINAL_APP"
          mkdir -p "$GITHUB_WORKSPACE/dist"

          # 2. Point directly to extracted Deluge.app bundles
          ARM_APP="/tmp/thin_builds/arm64_extracted/Deluge.app"
          X86_APP="/tmp/thin_builds/x86_extracted/Deluge.app"

          if [ ! -d "$ARM_APP" ] || [ ! -d "$X86_APP" ]; then
            echo "Error: Failed to locate Deluge.app in extracted archives!"
            exit 1
          fi

          echo "Found ARM app at: $ARM_APP"
          echo "Found x86 app at: $X86_APP"

          # 3. Establish base structure from ARM64 build into dist/Deluge.app
          cp -a "$ARM_APP" "$FINAL_APP"

          # 4. Explicitly stitch Python binary target into Universal2 FIRST
          echo "=== Merging Python.framework Binary ==="
          ARM_PY=$(find "$ARM_APP" -path "*/Python.framework/*" -type f -name "Python" -exec file {} + | grep "Mach-O" | cut -d: -f1 | head -n 1)
          X86_PY=$(find "$X86_APP" -path "*/Python.framework/*" -type f -name "Python" -exec file {} + | grep "Mach-O" | cut -d: -f1 | head -n 1)

          if [ -n "$ARM_PY" ] && [ -n "$X86_PY" ]; then
            echo "Building Universal2 Python binary target..."
            mkdir -p "$FINAL_APP/Contents/Frameworks/Python.framework/Versions/3.11"
            lipo -create "$ARM_PY" "$X86_PY" -output "$FINAL_APP/Contents/Frameworks/Python.framework/Versions/3.11/Python"
            ln -sf "Versions/3.11/Python" "$FINAL_APP/Contents/Frameworks/Python.framework/Python"
          else
            echo "Error: Failed to locate Python framework binaries for lipo!"
            exit 1
          fi

          install_name_tool -id "@rpath/Python.framework/Versions/3.11/Python" \
            "$FINAL_APP/Contents/Frameworks/Python.framework/Versions/3.11/Python"

          # 5. Recursively merge all remaining Mach-O binaries
          echo "=== Merging Dynamic Libraries (.dylib) and C-Extensions (.so) ==="
          find "$ARM_APP/Contents" -type f ! -type l 2>/dev/null | while read -r arm_file; do
            rel_path="${arm_file#$ARM_APP/Contents/}"

            if [[ "$rel_path" == "MacOS/Deluge" ]] || [[ "$rel_path" == *"Python.framework/Python"* ]] || [[ "$rel_path" == *"Python.framework/Versions/"* ]]; then
              continue
            fi

            x86_file="$X86_APP/Contents/$rel_path"
            target_file="$FINAL_APP/Contents/$rel_path"

            if [ -f "$x86_file" ] && file -b "$arm_file" | grep -q "Mach-O"; then
              echo "Lipo merging: Contents/$rel_path"
              mkdir -p "$(dirname "$target_file")"
              lipo -create "$arm_file" "$x86_file" -output "$target_file"
            fi
          done

          # 6. Compile Native Universal2 Launcher Executable
          echo "=== Compiling Native Universal2 Bootstrapper ==="

          PY_VER="3.11"
          BUNDLE_FRAMEWORKS="$FINAL_APP/Contents/Frameworks"
          PY_INC="$BUNDLE_FRAMEWORKS/Python.framework/Versions/$PY_VER/include/python$PY_VER"

          if [ ! -d "$PY_INC" ]; then
            PY_INC="/Library/Frameworks/Python.framework/Versions/$PY_VER/include/python$PY_VER"
          fi

          echo "Using Python $PY_VER Headers from: $PY_INC"

          cat <<EOF > launcher.c
          #include <Python.h>
          #include <libgen.h>
          #include <limits.h>
          #include <mach-o/dyld.h>
          #include <stdio.h>
          #include <stdlib.h>
          #include <unistd.h>

          int main(int argc, char *argv[]) {
              char path[PATH_MAX];
              uint32_t size = sizeof(path);
              if (_NSGetExecutablePath(path, &size) != 0) return 1;

              char resolved_path[PATH_MAX];
              if (!realpath(path, resolved_path)) return 1;
              char *exec_dir = dirname(resolved_path);

              // Resolve directories relative to MacOS/
              char zip_path[PATH_MAX], fw_dir[PATH_MAX], res_dir[PATH_MAX], cache_path[PATH_MAX], schema_dir[PATH_MAX], typelib_dir[PATH_MAX], share_dir[PATH_MAX];
              snprintf(zip_path, sizeof(zip_path), "%s/../Resources/base_library.zip", exec_dir);
              snprintf(fw_dir, sizeof(fw_dir), "%s/../Frameworks", exec_dir);
              snprintf(res_dir, sizeof(res_dir), "%s/../Resources", exec_dir);
              snprintf(cache_path, sizeof(cache_path), "%s/../Resources/lib/gdk-pixbuf-2.0/2.10.0/loaders.cache", exec_dir);
              snprintf(schema_dir, sizeof(schema_dir), "%s/../Resources/share/glib-2.0/schemas", exec_dir);
              snprintf(typelib_dir, sizeof(typelib_dir), "%s/../Resources/girepository-1.0", exec_dir);
              snprintf(share_dir, sizeof(share_dir), "%s/../Resources/share", exec_dir);

              // Completely strip host Homebrew fallback paths to prevent dual GIO loading
              unsetenv("DYLD_FALLBACK_LIBRARY_PATH");
              unsetenv("DYLD_FALLBACK_FRAMEWORK_PATH");
              setenv("DYLD_LIBRARY_PATH", fw_dir, 1);
              setenv("DYLD_FRAMEWORK_PATH", fw_dir, 1);

              // GTK / GdkPixbuf / GI variables must be set at C level before Python bindings start loading shared libs
              setenv("GDK_PIXBUF_MODULE_FILE", cache_path, 1);
              setenv("GDK_PIXBUF_MODULEDIR", fw_dir, 1);
              setenv("GI_TYPELIB_PATH", typelib_dir, 1);
              setenv("GSETTINGS_SCHEMA_DIR", schema_dir, 1);
              setenv("XDG_DATA_DIRS", share_dir, 1);

              PyConfig config;
              PyConfig_InitIsolatedConfig(&config);

              // Explicitly set module search paths
              config.module_search_paths_set = 1;

              wchar_t *w_zip = Py_DecodeLocale(zip_path, NULL);
              wchar_t *w_fw  = Py_DecodeLocale(fw_dir, NULL);
              wchar_t *w_res = Py_DecodeLocale(res_dir, NULL);

              // Must append base_library.zip FIRST so CPython can load codecs on boot
              PyWideStringList_Append(&config.module_search_paths, w_zip);
              PyWideStringList_Append(&config.module_search_paths, w_fw);
              PyWideStringList_Append(&config.module_search_paths, w_res);

              PyMem_RawFree(w_zip);
              PyMem_RawFree(w_fw);
              PyMem_RawFree(w_res);

              PyStatus status = Py_InitializeFromConfig(&config);
              PyConfig_Clear(&config);

              if (PyStatus_Exception(status)) {
                  if (status.err_msg) {
                      fprintf(stderr, "Python initialization error: %s\n", status.err_msg);
                  }
                  return 1;
              }

              const char *script =
                  "import sys, os, builtins, warnings\n"
                  "# Suppress deprecation warnings for clean output\n"
                  "warnings.filterwarnings('ignore', category=UserWarning, module='pkg_resources')\n"
                  "warnings.filterwarnings('ignore', category=DeprecationWarning)\n"
                  "\n"
                  "exec_dir = os.path.dirname(os.path.realpath(sys.executable))\n"
                  "bundle = os.path.abspath(os.path.join(exec_dir, '..'))\n"
                  "res = os.path.join(bundle, 'Resources')\n"
                  "fw = os.path.join(bundle, 'Frameworks')\n"
                  "zip_path = os.path.join(res, 'base_library.zip')\n"
                  "\n"
                  "# Path insertion\n"
                  "for p in [zip_path, fw, res, exec_dir]:\n"
                  "    if os.path.exists(p) and p not in sys.path:\n"
                  "        sys.path.insert(0, p)\n"
                  "\n"
                  "try:\n"
                  "    import gettext\n"
                  "    builtins._ = gettext.translation('deluge', fallback=True).gettext\n"
                  "except Exception:\n"
                  "    builtins._ = lambda msg: msg\n"
                  "\n"
                  "# Instantiate Deluge GtkUI\n"
                  "import argparse\n"
                  "from deluge.ui.gtk3.gtkui import GtkUI\n"
                  "args = argparse.Namespace(torrents=[])\n"
                  "GtkUI(args).start()\n";

              int result = PyRun_SimpleString(script);
              Py_Finalize();
              return result;
          }
          EOF

          clang -arch arm64 -arch x86_64 \
            -I"$PY_INC" \
            -F"$BUNDLE_FRAMEWORKS" \
            -framework Python \
            -rpath "@executable_path/../Frameworks" \
            launcher.c -o "$FINAL_APP/Contents/MacOS/Deluge"

          HARDCODED_PATH=$(otool -L "$FINAL_APP/Contents/MacOS/Deluge" | grep "Python.framework" | awk '{print $1}' | sort -u | head -n 1)
          if [ -n "$HARDCODED_PATH" ]; then
            install_name_tool -change "$HARDCODED_PATH" "@rpath/Python.framework/Versions/$PY_VER/Python" "$FINAL_APP/Contents/MacOS/Deluge"
          fi

          chmod +x "$FINAL_APP/Contents/MacOS/Deluge"
          rm -f launcher.c

          echo "=== Verifying Built Python $PY_VER Executable Dependencies ==="
          otool -L "$FINAL_APP/Contents/MacOS/Deluge"

      - name: Clean Broken Symlinks in Bundle
        run: |
          echo "=== Removing Dead Symlinks ==="
          REMOVED_COUNT=0
          while read -r link; do
            if [ -n "$link" ]; then
              echo "Removing broken symlink: $link"
              rm -f "$link"
              REMOVED_COUNT=$((REMOVED_COUNT + 1))
            fi
          done < <(find "$FINAL_APP/Contents" -type l ! -exec test -e {} \; -print)

          echo "Cleaned $REMOVED_COUNT broken symlinks."

      - name: Audit Universal2 Bundle Structure & Mach-O Files
        run: |
          echo "=== 1. Checking Application Directory Tree ==="
          ls -la "$FINAL_APP"
          ls -la "$FINAL_APP/Contents"
          ls -la "$FINAL_APP/Contents/MacOS"

          if [ -d "$FINAL_APP/Contents/Frameworks" ]; then
            echo "=== Frameworks Directory Found ==="
            ls -la "$FINAL_APP/Contents/Frameworks" | head -n 20
          else
            echo "WARNING: Contents/Frameworks DOES NOT EXIST!"
          fi

          echo "=== 2. Auditing Regular Files vs Symlinks ==="
          TOTAL_FILES=$(find "$FINAL_APP/Contents" -type f | wc -l | xargs)
          TOTAL_SYMLINKS=$(find "$FINAL_APP/Contents" -type l | wc -l | xargs)
          PHYSICAL_FILES=$(find "$FINAL_APP/Contents" -type f ! -type l | wc -l | xargs)

          echo "Total regular file nodes: $TOTAL_FILES"
          echo "Total symlinks: $TOTAL_SYMLINKS"
          echo "Physical files: $PHYSICAL_FILES"

          echo "=== 3. Locating ALL Mach-O Binaries in Bundle ==="
          MACHO_COUNT=0
          while read -r file; do
            if file -b "$file" | grep -q "Mach-O"; then
              echo "Found Mach-O: ${file#$FINAL_APP/}"
              MACHO_COUNT=$((MACHO_COUNT + 1))
            fi
          done < <(find "$FINAL_APP/Contents" -type f ! -type l)

          echo "Mach-O files: $MACHO_COUNT"

          echo "=== 4. Testing Symlink Target Resolutions ==="
          BROKEN_LINKS=$(find "$FINAL_APP/Contents" -type l ! -exec test -e {} \; -print)
          if [ -n "$BROKEN_LINKS" ]; then
            echo "ERROR: Found broken symlinks inside bundle!"
            echo "$BROKEN_LINKS"
            exit 1
          else
            echo "All symlinks resolve cleanly to valid targets."
          fi

      - name: Import Apple Developer Certificate
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE }}
          P12_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
          KEYCHAIN_PASSWORD: "temporary_actions_password"
        run: |
          echo $BUILD_CERTIFICATE_BASE64 | base64 --decode --output certificate.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security import certificate.p12 -k build.keychain -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain

      - name: Create Entitlements File
        run: |
          cat <<EOF > entitlements.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>com.apple.security.cs.allow-jit</key>
              <true/>
              <key>com.apple.security.cs.allow-unsigned-executable-memory</key>
              <true/>
              <key>com.apple.security.cs.disable-executable-page-protection</key>
              <true/>
              <key>com.apple.security.cs.disable-library-validation</key>
              <true/>
          </dict>
          </plist>
          EOF

      - name: Sign Universal2 App Bundle
        run: |
          if [ ! -d "$FINAL_APP/Contents" ]; then
            echo "Error: Could not locate $FINAL_APP!"
            exit 1
          fi

          security set-keychain-settings -lut 7200 build.keychain
          security unlock-keychain -p "temporary_actions_password" build.keychain

          chmod +x "$FINAL_APP/Contents/MacOS/Deluge"

          FRAMEWORK_DIR="$FINAL_APP/Contents/Frameworks/Python.framework"

          echo "=== 1. Validating Framework Metadata ==="
          if [ -d "$FRAMEWORK_DIR" ] && [ ! -f "$FRAMEWORK_DIR/Resources/Info.plist" ] && [ ! -f "$FRAMEWORK_DIR/Info.plist" ]; then
            mkdir -p "$FRAMEWORK_DIR/Resources"
            printf '%s\n' \
              '<?xml version="1.0" encoding="UTF-8"?>' \
              '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">' \
              '<plist version="1.0">' \
              '<dict>' \
              '    <key>CFBundleDevelopmentRegion</key>' \
              '    <string>English</string>' \
              '    <key>CFBundleExecutable</key>' \
              '    <string>Python</string>' \
              '    <key>CFBundleIdentifier</key>' \
              '    <string>org.python.python</string>' \
              '    <key>CFBundleInfoDictionaryVersion</key>' \
              '    <string>6.0</string>' \
              '    <key>CFBundleName</key>' \
              '    <string>Python</string>' \
              '    <key>CFBundlePackageType</key>' \
              '    <string>FMWK</string>' \
              '</dict>' \
              '</plist>' > "$FRAMEWORK_DIR/Resources/Info.plist"
          fi

          echo "=== 2. Signing Dynamic Libraries and C-Extensions ==="
          FILES_TO_SIGN=$(mktemp)
          find "$FINAL_APP/Contents" -type f ! -type l > "$FILES_TO_SIGN"

          SIGNED_COUNT=0
          while read -r file; do
            if [ "$file" != "$FINAL_APP/Contents/MacOS/Deluge" ] && [[ "$file" != *"/Python.framework/"* ]]; then
              if file -b "$file" | grep -q "Mach-O"; then
                codesign --force --options runtime --timestamp \
                  --sign "${{ secrets.APPLE_DEVELOPER_IDENTITY }}" \
                  --keychain build.keychain "$file"
                SIGNED_COUNT=$((SIGNED_COUNT + 1))
              fi
            fi
          done < "$FILES_TO_SIGN"
          rm -f "$FILES_TO_SIGN"

          echo "Signed $SIGNED_COUNT standalone dynamic libraries."

          echo "=== 3. Signing Python.framework Subcomponent ==="
          if [ -d "$FRAMEWORK_DIR" ]; then
            codesign --force --options runtime --timestamp \
              --sign "${{ secrets.APPLE_DEVELOPER_IDENTITY }}" \
              --keychain build.keychain "$FRAMEWORK_DIR"
          fi

          echo "=== 4. Signing Main Executable ==="
          codesign --force --options runtime --timestamp --entitlements entitlements.plist \
            --sign "${{ secrets.APPLE_DEVELOPER_IDENTITY }}" --keychain build.keychain \
            "$FINAL_APP/Contents/MacOS/Deluge"

          echo "=== 5. Signing Outer Application Bundle ==="
          codesign --force --options runtime --timestamp --entitlements entitlements.plist \
            --sign "${{ secrets.APPLE_DEVELOPER_IDENTITY }}" --keychain build.keychain \
            "$FINAL_APP"

          echo "=== 6. Verifying Bundle Signature ==="
          cd "$GITHUB_WORKSPACE/dist"
          codesign --verify --verbose=4 --strict "Deluge.app"

      - name: Verify Architecture Slices
        run: |
          echo "=== Main Executable Architecture ==="
          lipo -info "$FINAL_APP/Contents/MacOS/Deluge"

          echo "=== Primary GTK Dynamic Library ==="
          find "$FINAL_APP/Contents/Frameworks" -name "libgtk-3*.dylib" -exec lipo -info {} \; 2>/dev/null || true

          echo "=== Core C-Extensions (rencode / cffi) ==="
          find "$FINAL_APP" \( -name "_rencode*.so" -o -name "_cffi_backend*.so" \) -exec lipo -info {} \; 2>/dev/null || true

      - name: Build Outer DMG Installer
        run: |
          if [[ "${{ github.ref }}" == refs/tags/deluge-* ]]; then
            RAW_VERSION="${{ github.ref_name }}"
            APP_VERSION="${RAW_VERSION#deluge-}"
          else
            APP_VERSION="2.2.0"
          fi
          echo "RESOLVED_APP_VERSION=${APP_VERSION}" >> $GITHUB_ENV
          DMG_FILE="Deluge-${APP_VERSION}-Universal.dmg"

          rm -rf secure_dmg_staging "$DMG_FILE"
          mkdir -p secure_dmg_staging
          ditto "$GITHUB_WORKSPACE/dist/Deluge.app" secure_dmg_staging/Deluge.app

          create-dmg \
            --volname "Deluge Universal Installer" \
            --window-pos 200 120 \
            --window-size 800 400 \
            --icon-size 100 \
            --icon "Deluge.app" 200 190 \
            --app-drop-link 600 190 \
            "$DMG_FILE" \
            "secure_dmg_staging/" || true

          if [ ! -f "$DMG_FILE" ]; then
            echo "Error: $DMG_FILE was not generated!"
            exit 1
          fi

          codesign --force --options runtime --timestamp \
            --sign "${{ secrets.APPLE_DEVELOPER_IDENTITY }}" \
            --keychain build.keychain "$DMG_FILE"

      - name: Notarize and Staple DMG
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          DMG_NAME="Deluge-${{ env.RESOLVED_APP_VERSION }}-Universal.dmg"
          echo "Submitting $DMG_NAME for Apple notarization..."

          SUBMISSION_OUT=$(xcrun notarytool submit "$DMG_NAME" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_PASSWORD" \
            --team-id "$TEAM_ID" \
            --wait 2>&1)

          echo "$SUBMISSION_OUT"
          SUBMISSION_ID=$(echo "$SUBMISSION_OUT" | awk '/id: / { print $2; exit; }')

          if echo "$SUBMISSION_OUT" | grep -qE "status: (Invalid|Rejected)" || [ -z "$SUBMISSION_ID" ]; then
            echo "=== Notarization Failed. Fetching Log... ==="
            [ -n "$SUBMISSION_ID" ] && xcrun notarytool log "$SUBMISSION_ID" \
              --apple-id "$APPLE_ID" \
              --password "$APPLE_PASSWORD" \
              --team-id "$TEAM_ID"
            exit 1
          fi

          echo "=== Stapling Notarization Ticket ==="
          sleep 5
          xcrun stapler staple "$DMG_NAME"
          xcrun stapler validate "$DMG_NAME"

      - name: Upload Finished DMG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Deluge-macOS-Universal
          path: Deluge-*-Universal.dmg
